<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c18"/>
      <stop offset="50%" style="stop-color:#0b1028"/>
      <stop offset="100%" style="stop-color:#080e1c"/>
    </linearGradient>
    <linearGradient id="dgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4; stop-opacity:0"/>
      <stop offset="15%" style="stop-color:#06b6d4; stop-opacity:0.8"/>
      <stop offset="85%" style="stop-color:#3b82f6; stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#3b82f6; stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="35%" cy="35%" r="40%">
      <stop offset="0%" style="stop-color:#06b6d4; stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#06b6d4; stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="55%" r="35%">
      <stop offset="0%" style="stop-color:#3b82f6; stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#3b82f6; stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#06b6d4" stroke-width="0.5" fill="none">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.25">
    <polyline points="50,50 50,90"/>
    <polyline points="50,50 90,50"/>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.25">
    <polyline points="1150,50 1150,90"/>
    <polyline points="1110,50 1150,50"/>
  </g>
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.25">
    <polyline points="50,580 50,540"/>
    <polyline points="50,580 90,580"/>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.25">
    <polyline points="1150,580 1150,540"/>
    <polyline points="1110,580 1150,580"/>
  </g>

  <!-- Main logo [DG]Max -->
  <text y="275" font-family="Liberation Mono, monospace" font-size="100">
    <tspan x="378" fill="url(#dgGrad)" font-weight="normal">[</tspan><tspan fill="url(#dgGrad)" font-weight="bold">DG</tspan><tspan fill="url(#dgGrad)" font-weight="normal">]</tspan><tspan fill="#f1f5f9" font-weight="bold">Max</tspan>
  </text>

  <!-- Accent divider line -->
  <rect x="380" y="305" width="440" height="2" rx="1" fill="url(#accentLine)"/>

  <!-- Tagline -->
  <text x="600" y="358" text-anchor="middle" font-family="Liberation Mono, monospace" font-size="21" fill="#94a3b8" font-weight="normal" letter-spacing="3">
    Facturación Electrónica e-CF
  </text>

  <!-- Provider badge — no number -->
  <text x="600" y="398" text-anchor="middle" font-family="Liberation Mono, monospace" font-size="15" fill="#64748b" font-weight="normal" letter-spacing="2">
    Proveedor Certificado DGII
  </text>

  <!-- Domain -->
  <text x="600" y="555" text-anchor="middle" font-family="Liberation Mono, monospace" font-size="17" fill="#475569" font-weight="normal" letter-spacing="3">
    dgmax.do
  </text>
</svg>